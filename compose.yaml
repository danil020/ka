services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: latihan_root_password
      MYSQL_DATABASE: praktikum_db
      MYSQL_USER: praktikum_user
      MYSQL_PASSWORD: latihan_app_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-platihan_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: praktikum_db
      DB_USER: praktikum_user
      DB_PASSWORD: latihan_app_password
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
